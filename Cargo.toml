[package]
name = "Crystal-wave"
version = "0.1.0"
edition = "2024"
authors = ["Faez Barghasa <faez.barghasa@gmail.com>"]
description = "Clean-room pure Rust implementation and verification engine for Apple Logic Pro 12.3.1 core architectures"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# -------------------------------------------------------------
# 1. UI & GPU Graphics Pipeline
# -------------------------------------------------------------
# Core UI toolkit; enable 'wgpu', 'canvas', 'multi-window', and 'advanced'
iced = { version = "0.14", features = [
    "wgpu",
    "canvas",
    "advanced",
] }
iced_wgpu = "0.14"

# Raw GPU access for high-density waveform timelines (embedded in iced shader)
wgpu = "30.0"
bytemuck = { version = "1.20", features = ["derive"] }
cosmic-text = "0.19.0"                                 # High-performance sub-pixel text rendering for rulers

# -------------------------------------------------------------
# 2. Audio Hardware I/O & Real-Time Kernel Promotion
# -------------------------------------------------------------
cpal = { version = "0.18", features = ["asio"] }
# jack = "0.13" # Optional hardware backend, requires libjack-dev

# Real-time thread priority elevation (prevent OS kernel preemption)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7.0"

# -------------------------------------------------------------
# 3. Real-Time Safety & Lock-Free IPC
# -------------------------------------------------------------
# Wait-free bounded SPSC queue for audio <-> GUI telemetry
rtrb = "0.4.0"

# Deferred drop collector (never drop memory on the audio thread)
basedrop = "0.1"

# Cross-thread channels for non-realtime workers (disk/analysis)
crossbeam-channel = "0.5"

# Lock-free atomic floats for playheads, BPM, and parameter sliders
atomic_float = "1.1"
portable-atomic = "1.10"

# -------------------------------------------------------------
# 4. DSP Math, SIMD & Signal Processing
# -------------------------------------------------------------
# Explicit cross-platform SIMD vectorization (AVX2, AVX-512, NEON)
wide = "1.7.1"

# High-quality sample rate conversion (polyphase sinc/FFT)
rubato = "5.0"

# Ultra-fast real-time FFT for spectrum analyzers
microfft = "0.6"

# Graph DAG scheduling & latency compensation (PDC) calculation
petgraph = "0.8.3"
crossbeam-deque = "0.8" # Real-time task work queues for parallel DSP
core_affinity = "0.8"   # Pin audio threads to performance cores

# -------------------------------------------------------------
# 5. Audio Codecs, Disk Streaming & Caching
# -------------------------------------------------------------
symphonia = { version = "0.6.1", features = ["all"] } # FLAC, MP3, AAC, OGG
hound = "3.5" # Uncompressed WAV
memmap2 = "0.9" # Peak pyramid mipmaps (zero-RAM wave files)
rkyv = { version = "0.8", features = [
    "bytecheck",
] } # Zero-copy project serialization
rayon = "1.10" # Background disk buffering & offline render

# -------------------------------------------------------------
# 6. MIDI 1.0 / 2.0 & Hardware Control
# -------------------------------------------------------------
midir = "0.11.1"
wmidi = "4.0"    # Zero-alloc parsing for the real-time callback
midly = "0.5"    # Fast SMF parsing for timeline clip loading

# -------------------------------------------------------------
# 7. Plugin Hosting (CLAP & VST3)
# -------------------------------------------------------------
clack-host = "0.2"
clack-extensions = "0.2"
#vst3-sys = "0.6"
raw-window-handle = "0.6"
libloading = "0.9.0"


[dev-dependencies]
proptest = "1.6"
